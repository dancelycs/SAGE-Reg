[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sagereg"
version = "0.1.0"
description = "Sampling-aware graph expansion and regeneration for robust point-cloud registration"
readme = "README.md"
authors = [
  {name = "Jie Yang"},
  {name = "Shaoyan Gai"},
  {name = "Feipeng Da"},
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/dancelycs/SAGE-Reg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
